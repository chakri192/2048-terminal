<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
  </defs>
  <style>
    .t  { font-family: SFMono-Regular,Menlo,Consolas,monospace; font-weight: 700; font-size: 17px; text-anchor: middle; }
    .lbl{ font-size: 11px; fill: #8a9bb4; }
    .mn { font-family: SFMono-Regular,Menlo,Consolas,monospace; font-size: 10.5px; fill: #7d8899; }
  </style>

  <rect width="880" height="430" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="429" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">ONE ROW TRANSFORM, FOUR DIRECTIONS</text>

  <!-- ── the pipeline ── -->
  <g>
    <!-- input row -->
    <text x="28" y="82" class="lbl">the row</text>
    <rect x="128" y="62" width="44" height="34" rx="4" fill="#eee4da"/><text x="150" y="85" class="t" fill="#776e65">2</text>
    <rect x="178" y="62" width="44" height="34" rx="4" fill="#646464"/>
    <rect x="228" y="62" width="44" height="34" rx="4" fill="#eee4da"/><text x="250" y="85" class="t" fill="#776e65">2</text>
    <rect x="278" y="62" width="44" height="34" rx="4" fill="#ede0c8"/><text x="300" y="85" class="t" fill="#776e65">4</text>

    <line x1="340" y1="79" x2="368" y2="79" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="382" y="76" class="mn" fill="#5fd0de">_compress()</text>
    <text x="382" y="90" class="mn">drop the zeros</text>

    <!-- compressed -->
    <text x="28" y="142" class="lbl">compressed</text>
    <rect x="128" y="122" width="44" height="34" rx="4" fill="#eee4da"/><text x="150" y="145" class="t" fill="#776e65">2</text>
    <rect x="178" y="122" width="44" height="34" rx="4" fill="#eee4da"/><text x="200" y="145" class="t" fill="#776e65">2</text>
    <rect x="228" y="122" width="44" height="34" rx="4" fill="#ede0c8"/><text x="250" y="145" class="t" fill="#776e65">4</text>

    <line x1="340" y1="139" x2="368" y2="139" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="382" y="136" class="mn" fill="#7ddc8b">_merge()</text>
    <text x="382" y="150" class="mn">equal neighbours combine</text>

    <!-- merged -->
    <text x="28" y="202" class="lbl">merged</text>
    <rect x="128" y="182" width="44" height="34" rx="4" fill="#ede0c8"/><text x="150" y="205" class="t" fill="#776e65">4</text>
    <rect x="178" y="182" width="44" height="34" rx="4" fill="#ede0c8"/><text x="200" y="205" class="t" fill="#776e65">4</text>
    <text x="250" y="205" font-size="11" fill="#7ddc8b" text-anchor="middle">score +4</text>

    <line x1="340" y1="199" x2="368" y2="199" stroke="#6b7688" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="382" y="196" class="mn" fill="#f0b866">_pad_line()</text>
    <text x="382" y="210" class="mn">back to width 4</text>

    <!-- padded -->
    <text x="28" y="262" class="lbl">written back</text>
    <rect x="128" y="242" width="44" height="34" rx="4" fill="#ede0c8"/><text x="150" y="265" class="t" fill="#776e65">4</text>
    <rect x="178" y="242" width="44" height="34" rx="4" fill="#ede0c8"/><text x="200" y="265" class="t" fill="#776e65">4</text>
    <rect x="228" y="242" width="44" height="34" rx="4" fill="#646464"/>
    <rect x="278" y="242" width="44" height="34" rx="4" fill="#646464"/>
  </g>

  <!-- divider -->
  <line x1="596" y1="56" x2="596" y2="300" stroke="#2b313d"/>

  <!-- ── the four directions ── -->
  <text x="624" y="76" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">EVERY DIRECTION REUSES IT</text>

  <g class="mn" font-size="10.5">
    <rect x="624" y="90" width="216" height="46" rx="6" fill="#12151b" stroke="#39414f"/>
    <text x="638" y="110" fill="#5fd0de" font-weight="700">LEFT</text>
    <text x="700" y="110" fill="#8a9bb4">the row, as it is</text>
    <text x="638" y="127" fill="#7d8899">grid[i]</text>

    <rect x="624" y="144" width="216" height="46" rx="6" fill="#12151b" stroke="#39414f"/>
    <text x="638" y="164" fill="#5fd0de" font-weight="700">RIGHT</text>
    <text x="700" y="164" fill="#8a9bb4">reversed, then un-reversed</text>
    <text x="638" y="181" fill="#7d8899">grid[i][::-1] … [::-1]</text>

    <rect x="624" y="198" width="216" height="46" rx="6" fill="#12151b" stroke="#39414f"/>
    <text x="638" y="218" fill="#5fd0de" font-weight="700">UP</text>
    <text x="700" y="218" fill="#8a9bb4">the column instead</text>
    <text x="638" y="235" fill="#7d8899">[grid[i][j] for i in …]</text>

    <rect x="624" y="252" width="216" height="46" rx="6" fill="#12151b" stroke="#39414f"/>
    <text x="638" y="272" fill="#5fd0de" font-weight="700">DOWN</text>
    <text x="700" y="272" fill="#8a9bb4">column, reversed both ways</text>
    <text x="638" y="289" fill="#7d8899">column[::-1] … [::-1]</text>
  </g>

  <!-- footer notes -->
  <line x1="28" y1="320" x2="852" y2="320" stroke="#2b313d"/>

  <rect x="28" y="336" width="400" height="72" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="44" y="356" font-size="10.5" font-weight="700" fill="#e6edf3">why 2+2+4 never becomes 8</text>
  <text x="44" y="374" font-size="10" fill="#8a9bb4">_merge walks the line with i += 2 after a merge, so a tile</text>
  <text x="44" y="388" font-size="10" fill="#8a9bb4">that has just combined is skipped past — it cannot merge</text>
  <text x="44" y="402" font-size="10" fill="#8a9bb4">a second time in the same move. That is the real 2048 rule.</text>

  <rect x="452" y="336" width="400" height="72" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
  <text x="468" y="356" font-size="10.5" font-weight="700" fill="#e6edf3">how "is this move legal?" is answered</text>
  <text x="468" y="374" font-size="10" fill="#8a9bb4">_can_move plays the move on a deep copy and checks whether</text>
  <text x="468" y="388" font-size="10" fill="#8a9bb4">anything shifted. Since _merge mutates the score as a side</text>
  <text x="468" y="402" font-size="10" fill="#8a9bb4">effect, the probe saves and restores it — or scores inflate.</text>
</svg>
